name: Temporary toolchain refresh
on:
  push:
    branches: [maintenance/refresh-toolchain-20261010]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Upgrade dependency versions
        run: |
          npm pkg delete devDependencies.eslint-config-standard devDependencies.eslint-plugin-import devDependencies.eslint-plugin-n devDependencies.eslint-plugin-promise
          npx --yes npm-check-updates@latest -u -x eslint,typescript,jest,ts-jest
      - name: Install refreshed dependency graph
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm run build
      - name: Commit upgraded dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh html-parser dependencies"
            git push
          fi
